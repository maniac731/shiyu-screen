<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>食愈 · 屏幕视觉提案</title>
<style>
:root{--paper:#f5f2eb;--surface:#fffdf8;--ink:#263d32;--muted:#627267;--line:#dedfd4;--green:#dce8d6;--deep:#34523d;--amber:#8b5b29}*{box-sizing:border-box}body{margin:0;background:#e7e8e0;color:var(--ink);font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}button,select{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,select:focus-visible{outline:3px solid #659152;outline-offset:3px}.proposal{max-width:1120px;margin:28px auto;padding:0 24px}.eyebrow{font-size:12px;letter-spacing:3px;color:#61725e}h1{font-size:25px;font-weight:600;margin:10px 0 8px}.intro{font-size:14px;color:#627160;margin:0;line-height:1.7}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:22px 0 18px}.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs button{border:0;background:transparent;padding:10px 16px;border-radius:20px;font-size:14px}.tabs button.active{background:var(--deep);color:white}.state{font-size:13px;color:#53634e}.state select{padding:9px;border:1px solid #c8cfc0;border-radius:8px;background:#f5f5ed;margin-left:8px}.bezel{background:#26352c;padding:14px;border-radius:24px;box-shadow:0 20px 60px #233d2320;width:max-content;max-width:100%;margin:auto}.stage{position:relative;overflow:hidden;border-radius:10px}.screen{width:1024px;height:600px;background:var(--paper);transform-origin:top left;position:absolute;top:0;left:0;overflow:hidden;font-size:24px}.screen button{border:0;background:none}.top{height:102px;display:flex;align-items:center;justify-content:space-between;padding:22px 36px;gap:16px}.brand{font-size:30px;font-weight:600;letter-spacing:4px}.top-title{display:flex;align-items:center;gap:18px;font-size:28px;font-weight:600}.icon-button{width:60px;height:60px;border-radius:18px!important;background:#e8ece1!important;display:grid;place-items:center;flex:none}.icon{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.status{font-size:19px;color:var(--muted);display:flex;align-items:center;gap:10px;font-weight:400;white-space:nowrap}.dot{width:8px;height:8px;border-radius:50%;background:#64875a;display:inline-block}.offline{color:var(--amber)}.offline .dot{background:#a6783f}.home-content{display:grid;grid-template-columns:608px 320px;gap:24px;padding:0 36px}.stock-card{height:434px;background:var(--surface);border:1px solid #e1e4d8;border-radius:24px;padding:24px 28px 0}.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.section-head h2{font-size:28px;font-weight:600;margin:0}.count{font-size:20px;padding:6px 12px;border-radius:14px;background:#eef1e7;color:#54674f}.preview-row{height:65px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e8eade}.name{font-weight:500;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.q{font-variant-numeric:tabular-nums;font-size:29px;white-space:nowrap}.unit{font-size:21px;color:var(--muted);margin-left:8px;font-weight:400}.all-stock{width:100%;height:66px;display:flex;align-items:center;justify-content:space-between;font-size:23px;font-weight:500}.right{display:flex;flex-direction:column;gap:20px}.clock{height:206px;background:#e9eddf;border-radius:24px;padding:25px 28px}.clock .time{font-size:68px;font-weight:500;letter-spacing:-2px;line-height:1.1;font-variant-numeric:tabular-nums}.clock .date{font-size:21px;margin-top:22px;color:#596b52}.phone-card{height:208px;background:#dce8d6;border-radius:24px;padding:24px 28px;position:relative;overflow:hidden}.phone-card .phone-icon{width:38px;height:38px;margin-bottom:12px}.phone-card strong{font-size:25px;display:block;font-weight:600}.phone-card p{font-size:20px;line-height:1.55;margin:10px 0;color:#53664c}.footnote{position:absolute;bottom:23px;left:36px;font-size:18px;color:#60715d}.list{margin:0 36px;background:var(--surface);border-radius:22px;overflow:hidden;border:1px solid #e1e4d8}.stock-row{height:66px;width:100%;display:flex;align-items:center;gap:28px;padding:0 25px!important;text-align:left;border-bottom:1px solid #e7eade!important}.stock-row:last-child{border-bottom:0!important}.stock-row .name{font-size:27px;flex:1}.stock-row .q{font-size:29px}.chev{font-size:26px;color:#8e9d87;padding-left:4px}.pager{position:absolute;bottom:20px;left:36px;right:36px;height:64px;display:flex;align-items:center;justify-content:space-between}.pager button{min-width:170px;height:56px;border-radius:16px;background:#e4eadd;font-size:23px}.pager button:disabled{color:#9aa392;background:#eeeee6;cursor:default}.pager span{font-size:21px;color:#697960}.detail{margin:0 36px;border-radius:26px;background:var(--surface);padding:36px 42px;height:394px;border:1px solid #e1e4d8;position:relative}.detail .detail-name{font-size:40px;font-weight:500;margin:0 0 20px;max-width:800px;line-height:1.3}.detail small{display:block;color:var(--muted);font-size:22px}.detail .amount{font-size:76px;font-weight:500;line-height:1.2;margin-top:14px;letter-spacing:-2px}.detail .amount span{font-size:30px;margin-left:14px;letter-spacing:0;font-weight:400;color:var(--muted)}.detail-note{position:absolute;left:42px;bottom:30px;font-size:22px;color:#65775c;display:flex;gap:12px;align-items:center}.settings{margin:0 36px;background:var(--surface);border:1px solid #e1e4d8;border-radius:24px;padding:0 24px}.setting-row{min-height:104px;display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid #e4e7da;padding:14px 4px}.setting-row:last-child{border:0}.setting-row strong{display:block;font-size:25px;font-weight:500}.setting-row small{display:block;font-size:18px;margin-top:8px;color:#62725c}.setting-value{font-size:23px;color:#5d7053;display:flex;align-items:center;gap:16px}.stepper{display:flex;gap:14px;align-items:center}.stepper button{height:56px;width:56px;border-radius:14px;background:#e7eddf;font-size:28px}.stepper b{font-size:25px;min-width:84px;text-align:center;font-weight:500}.save{background:var(--deep)!important;color:white!important;border-radius:14px!important;height:56px;padding:0 26px!important;font-size:23px}.empty{height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.empty strong{font-size:28px;font-weight:500;margin:15px 0 12px}.empty p{font-size:22px;line-height:1.7;color:#62725c;margin:0}.empty .icon{width:44px;height:44px;color:#85987a}.list-empty{height:396px;display:flex;align-items:center;justify-content:center}.photo{position:absolute;inset:0;width:100%;height:100%;border:0;padding:0!important;cursor:pointer}.photo svg{width:100%;height:100%;display:block}.note{display:flex;justify-content:space-between;gap:24px;margin:18px auto 0;max-width:1024px;font-size:13px;line-height:1.65;color:#56644f}.screen button:active{filter:brightness(.96)}.screen .top button:active{transform:scale(.97)}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}@media(max-width:650px){.proposal{padding:0 12px;margin-top:20px}.bezel{padding:7px;border-radius:14px}.toolbar{margin:15px 0}.note{display:block}.intro{font-size:13px}}
</style>
<div class="proposal"><div class="eyebrow">SHIYU / SCREEN STUDY 01</div><h1>让厨房信息退到合适的位置</h1><p class="intro">主动查看时，库存清楚好找；放着不操作时，回到家里的照片。下方为可点击设计稿，使用示例数据。</p><div class="toolbar"><nav class="tabs" aria-label="设计稿页面"><button data-tab="home">首页</button><button data-tab="inventory">库存</button><button data-tab="detail">食材详情</button><button data-tab="photos">照片轮播</button><button data-tab="settings">设置</button></nav><label class="state">数据状态<select id="state"><option value="online">已同步</option><option value="offline">离线缓存</option><option value="empty">空库存</option><option value="loading">首次同步中</option></select></label></div><div class="bezel"><div class="stage"><main class="screen" aria-label="1024×600 屏幕预览"></main></div></div><div class="note"><span id="note"></span><span>原生尺寸 1024 × 600 · 照片背景为抽象占位示意<br>页面切换与状态模拟仅供设计评审，不连接实际设备或云端。</span></div></div>
<script>
const icons={back:'<path d="m17 5-7 9 7 9"/>',arrow:'<path d="M4 14h20m-7-7 7 7-7 7"/>',gear:'<path d="m11 3 6 0 1 4 4 2 4-1 3 5-3 3v4l3 3-3 5-4-1-4 2-1 4h-6l-1-4-4-2-4 1-3-5 3-3v-4l-3-3 3-5 4 1 4-2z" transform="translate(2 -1) scale(.8)"/><circle cx="14" cy="14" r="4"/>',phone:'<rect x="7" y="2" width="14" height="24" rx="3"/><path d="M12 22h4"/>',box:'<path d="m3 8 11-5 11 5v13l-11 5-11-5zM3 8l11 5 11-5M14 13v13M8 5.5l11 5"/>'};
const icon=(n,cls='')=>`<svg class="icon ${cls}" viewBox="0 0 28 28" aria-hidden="true">${icons[n]}</svg>`;
const items=[['番茄','3','个'],['鸡蛋','8','个'],['牛奶','2','盒'],['大米','2.5','千克'],['苹果','4','个'],['胡萝卜','2','根'],['洋葱','1','个'],['面粉','0.5','千克'],['豆腐','1','盒'],['土豆','3','个'],['黄瓜','2','根'],['燕麦','1','袋']];
let page='home',mode='online',index=0,stockPage=0,seconds=10,saved=true,photoIndex=0;const screen=document.querySelector('.screen');
const notes={home:'首页：库存是主内容，不展示未接入的菜谱与临期占位。设置只在首页出现。',inventory:'库存：单列六行，名称和数量左右对齐；整行可点，翻页位置固定。',detail:'详情：放大名称和数量；本阶段屏幕只读，修改仍在手机完成。',photos:'环境模式：满屏照片，不常驻标题、设置或导航；轻触任意处回到首页。',settings:'设置：仅保留当前可用功能。轮播时间按秒调整，点保存后生效。'};
const visible=()=>mode==='empty'||mode==='loading'?[]:items;
const status=()=>`<span class="status ${mode==='offline'?'offline':''}"><i class="dot"></i>${mode==='offline'?'离线 · 显示上次库存':mode==='loading'?'正在同步':'已同步'}</span>`;
const header=(title,back)=>`<header class="top"><div class="top-title"><button class="icon-button" data-go="${back}" aria-label="返回">${icon('back')}</button><span>${title}</span></div>${status()}</header>`;
function go(p){page=p;render();}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===page));document.querySelector('#note').textContent=notes[page];const rows=visible();
 if(page==='home')screen.innerHTML=`<header class="top"><div class="brand">食愈</div><div style="display:flex;align-items:center;gap:28px">${status()}<button class="icon-button" data-go="settings" aria-label="设置">${icon('gear')}</button></div></header><div class="home-content"><section class="stock-card"><div class="section-head"><h2>厨房库存</h2><span class="count">${mode==='loading'?'—':rows.length} 种</span></div>${rows.length?rows.slice(0,4).map((v,i)=>`<div class="preview-row"><span class="name">${v[0]}</span><span class="q">${v[1]}<span class="unit">${v[2]}</span></span></div>`).join(''):`<div class="empty">${icon('box')}<strong>${mode==='loading'?'正在同步厨房':'厨房还空着'}</strong><p>${mode==='loading'?'请保持网络连接':'在手机添加食材<br>这里就会同步出现'}</p></div>`}<button class="all-stock" data-go="inventory">${mode==='loading'?'查看库存状态':rows.length?'查看全部 '+rows.length+' 种':'查看库存'}${icon('arrow')}</button></section><aside class="right"><section class="clock"><div class="time">${mode==='loading'?'--:--':'18:42'}</div><div class="date">${mode==='loading'?'等待时间同步':'11 月 24 日 · 星期二'}</div></section><section class="phone-card">${icon('phone','phone-icon')}<strong>手机记录，家人共享</strong><p>添加食材、调整数量<br>都在手机完成</p></section></aside></div><div class="footnote">${mode==='offline'?'上次同步 18:30':'轻触查看库存 · 片刻后回到照片'}</div>`;
 else if(page==='inventory'){const pages=Math.max(1,Math.ceil(rows.length/6));stockPage=Math.min(stockPage,pages-1);screen.innerHTML=header('厨房库存','home')+`<section class="list">${rows.length?rows.slice(stockPage*6,stockPage*6+6).map((v,i)=>`<button class="stock-row" data-item="${stockPage*6+i}"><span class="name">${v[0]}</span><span class="q">${v[1]}<span class="unit">${v[2]}</span></span><span class="chev">›</span></button>`).join(''):`<div class="list-empty"><div class="empty">${icon('box')}<strong>${mode==='loading'?'等待第一次同步':'还没有食材'}</strong><p>${mode==='loading'?'保持联网，库存会自动出现':'在手机厨房页面添加<br>全家都能一起查看'}</p></div></div>`}</section><div class="pager"><button id="prev" ${stockPage?'':'disabled'}>‹ 上一页</button><span>${stockPage+1} / ${pages}</span><button id="next" ${stockPage+1<pages?'':'disabled'}>下一页 ›</button></div>`;screen.querySelector('#prev').onclick=()=>{stockPage--;render()};screen.querySelector('#next').onclick=()=>{stockPage++;render()};}
 else if(page==='detail'){const v=rows[index];screen.innerHTML=header('食材详情','inventory')+`<section class="detail"><h2 class="detail-name">${v?v[0]:'暂无可查看的食材'}</h2><small>${v?'家中现有':'请先在手机添加食材'}</small><div class="amount">${v?v[1]:'—'}<span>${v?v[2]:''}</span></div><div class="detail-note">${icon('phone')}数量在手机更新，屏幕自动同步</div></section><div class="footnote">${mode==='offline'?'当前为上次同步的库存，数量可能已发生变化':'轻触左上角，回到库存列表'}</div>`;}
 else if(page==='settings')screen.innerHTML=header('设置','home')+`<section class="settings"><div class="setting-row"><div><strong>网络连接</strong><small>${mode==='offline'?'当前离线，仍可查看缓存':'家庭 Wi-Fi'}</small></div><button class="setting-value existing-network" aria-label="配置网络">${mode==='offline'?'未连接':'已连接'}<span class="chev">›</span></button></div><div class="setting-row" style="min-height:132px"><div><strong>照片轮播</strong><small id="save-state">${saved?'已保存 · 仅在环境模式切换':'调整后请保存'}</small></div><div class="stepper"><button id="minus" aria-label="减少一秒">−</button><b>${seconds} 秒</b><button id="plus" aria-label="增加一秒">+</button><button class="save" id="save">${saved?'已保存':'保存'}</button></div></div><div class="setting-row"><div><strong>所属厨房</strong><small>成员和设备管理在手机完成</small></div><div class="setting-value">我的厨房</div></div></section><div class="footnote">设置只影响这块屏幕</div>`;
 else screen.innerHTML=`<button class="photo" data-go="home" aria-label="轻触回到首页"><svg viewBox="0 0 1024 600" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="wall" x2="0" y2="1"><stop stop-color="${photoIndex%2?'#b8c9bd':'#e0c8a3'}"/><stop offset="1" stop-color="#eee7d7"/></linearGradient><linearGradient id="vase"><stop stop-color="#b35f3f"/><stop offset="1" stop-color="#cf8761"/></linearGradient></defs><rect width="1024" height="600" fill="url(#wall)"/><rect x="80" y="45" width="280" height="390" rx="140" fill="#f6f0dd" opacity=".7"/><path d="M1024 80 380 600h300l344-290" fill="#fff6d4" opacity=".35"/><ellipse cx="595" cy="565" rx="320" ry="26" fill="#c6b99d"/><path d="M0 485q260-35 490-10t534-10v135H0" fill="#bda786"/><path d="M543 335h100l25 170q-55 35-150 0z" fill="url(#vase)"/><path d="M588 350q-18-180 115-258M590 330Q470 220 463 128M601 330q70-103 170-90" stroke="#647353" stroke-width="7" fill="none"/><g fill="#748266"><ellipse cx="659" cy="148" rx="26" ry="66" transform="rotate(43 659 148)"/><ellipse cx="621" cy="222" rx="27" ry="64" transform="rotate(-15 621 222)"/><ellipse cx="507" cy="209" rx="24" ry="67" transform="rotate(-42 507 209)"/><ellipse cx="469" cy="139" rx="22" ry="53" transform="rotate(-15 469 139)"/><ellipse cx="733" cy="252" rx="24" ry="67" transform="rotate(67 733 252)"/></g><path d="M300 508q0-70 70-70t70 70" fill="#e6d9ba"/><ellipse cx="370" cy="508" rx="70" ry="14" fill="#f2e7d0"/></svg></button>`;
 screen.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));screen.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>{index=+b.dataset.item;go('detail')});if(page==='settings'){screen.querySelector('.existing-network').onclick=()=>{document.querySelector('#note').textContent='配置网络：进入当前已验收的选网与密码键盘。此设计稿只展示入口，不重做这两页。'};screen.querySelector('#minus').onclick=()=>{seconds=Math.max(5,seconds-1);saved=false;render()};screen.querySelector('#plus').onclick=()=>{seconds=Math.min(300,seconds+1);saved=false;render()};screen.querySelector('#save').onclick=()=>{saved=true;render()};}resize();}
function resize(){const s=Math.min(1,(innerWidth-64)/1024);screen.style.transform=`scale(${s})`;document.querySelector('.stage').style.width=1024*s+'px';document.querySelector('.stage').style.height=600*s+'px';}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>go(b.dataset.tab));document.querySelector('#state').onchange=e=>{mode=e.target.value;stockPage=0;render()};window.addEventListener('resize',resize);render();
</script></html>
